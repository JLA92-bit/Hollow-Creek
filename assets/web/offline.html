<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollow Creek - offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #ffffff; color: #00294D; font-family: system-ui, sans-serif; text-align: center; }
  h1 { font-family: Georgia, serif; font-size: 2.4rem; margin: 0 0 .5rem; }
  p { color: #3D5670; max-width: 28rem; padding: 0 16px; }
  button { margin-top: 1rem; min-height: 44px; padding: 0 24px; border: 0; border-radius: 12px;
           background: #940E16; color: #fff; font-size: 1rem; font-weight: 700; }
</style>
</head>
<body>
  <main>
    <h1>Hollow Creek</h1>
    <p>You're offline, and the game hasn't finished downloading yet. Connect to the internet once and it will play offline after that.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
