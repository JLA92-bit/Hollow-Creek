name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and templates
        uses: actions/cache@v4
        with:
          path: |
            tools/bin
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-stable-${{ hashFiles('tools/setup_godot.sh') }}

      - name: Set up Godot
        run: bash tools/setup_godot.sh

      - name: Import assets
        run: |
          mkdir -p build && touch build/.gdignore
          tools/bin/godot --headless --path . --import || true
          tools/bin/godot --headless --path . --import

      - name: Run GUT tests
        run: |
          tools/bin/godot --headless --path . -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests -ginclude_subdirs -gexit 2>&1 | tee gut.log
          grep -q "All tests passed" gut.log

      - name: Build demo (M2 tools, scripted)
        run: timeout 600 tools/bin/godot --headless --path . res://scenes/build_ui/build_demo.tscn

      - name: Sandbox demo (M3 finished home, garden and share code)
        run: timeout 900 tools/bin/godot --headless --path . res://scenes/build_ui/sandbox_demo.tscn

      - name: Construction demo (M4 furnishing, scores and building stages)
        run: timeout 1200 tools/bin/godot --headless --path . res://scenes/build_ui/construction_demo.tscn

      - name: Residents demo (M5 move-ins, routines, wishes, rent)
        run: timeout 1200 tools/bin/godot --headless --path . res://scenes/resident_ui/residents_demo.tscn

      - name: Night demo (M6 light, sightlines, memories, traces)
        run: timeout 1200 tools/bin/godot --headless --path . res://scenes/resident_ui/night_demo.tscn

      - name: Investigation demo (M7 The Cash Tin solved with scripted taps)
        run: timeout 900 tools/bin/godot --headless --path . res://scenes/investigation/investigation_demo.tscn

      - name: Director demo (M8 a generated incident, solved by the bot)
        run: timeout 1200 tools/bin/godot --headless --path . res://scenes/investigation/director_demo.tscn

      - name: Prologue playtest (M9 arrival to the lesson, through the real game)
        run: timeout 1500 tools/bin/godot --headless --path . res://scenes/story/prologue_demo.tscn

      - name: Director soak (M8 fair cases only, solver bot, determinism)
        run: timeout 1500 tools/bin/godot --headless --path . -s tools/director_soak.gd -- --seeds 30 --days 28 --det-every 15

      - name: Export web build
        run: |
          mkdir -p build/web
          tools/bin/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.pck
          bash tools/build_packs.sh
          test -f build/web/packs/music.pck

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test in headless Chromium
        run: |
          npm ci
          touch node_modules/.gdignore
          npx playwright install --with-deps chromium
          node tools/web_smoke_test.mjs --viewport 1280x720 --out build/smoke.png

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: hollow-creek-web-${{ github.sha }}
          path: |
            build/web
            build/smoke.png
